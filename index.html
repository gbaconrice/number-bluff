<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b40"><title>ナンバーブラフ</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="guide-diagrams.css"><link rel="stylesheet" href="background-motion.css"><link rel="stylesheet" href="card-presentation.css"><link rel="stylesheet" href="card-art.css"><link rel="stylesheet" href="special-svg-motion.css"><link rel="stylesheet" href="component-card-reveal.css"><link rel="stylesheet" href="component-scene-motion.css"></head><body><main>
<section id="homeScreen" class="screen home"><h1 class="sr-only">ナンバーブラフ</h1><img class="home-brand" src="assets/home-logo.webp" alt="" aria-hidden="true"><div class="home-art" aria-hidden="true"><img class="home-scene" src="assets/home-hero.webp" alt=""></div><div class="home-actions"><label class="private-room-option"><input id="privateRoom" type="checkbox"><span>プライベートルームにする</span></label><button id="startGame" data-intent="createRoom" class="pill gold">ルームを作成</button><button id="joinGame" class="pill blue">ルームに参加</button><p id="roomCreateStatus" class="room-status" role="status" aria-live="polite"></p></div><nav class="home-icons" aria-label="案内"><button id="homeRules"><b aria-hidden="true">?</b><span class="icon-caption">遊び方</span></button><button id="homeSoundToggle" class="sound-toggle" data-sound-toggle aria-label="音をオフにする" aria-pressed="false"><b aria-hidden="true">♪</b><span class="icon-caption">音</span></button></nav></section>
<section id="lobbyScreen" class="screen hide" aria-label="ロビー"><header class="topbar"><h1 id="lobbyTitle"></h1><button id="copyRoomId" class="room-copy hide" type="button" aria-label="ルームIDをコピー">コピー</button><span id="lobbyHeaderSpacer" class="topbar-spacer" aria-hidden="true"></span></header><p id="roomIdentity" class="room-identity hide"></p><p id="roomCopyStatus" class="room-status hide" role="status" aria-live="polite"></p><input id="roomCopyFallback" class="room-copy-fallback hide" readonly aria-label="コピーするルームID"><p id="onlineLobbyStatus" class="room-status hide" role="status" aria-live="polite"></p><p id="lobbyError" class="error" role="alert"></p><section class="glass lobby-box"><h2>プレイヤー <span id="playerCount">4/8</span></h2><div id="lobbyPlayers" class="lobby-grid"></div></section><section class="glass bot-config"><h2>BOTの追加・設定 <small id="selectedBotLabel"></small></h2><div class="bot-choices" id="avatarChoices"><button data-avatar="0" aria-label="ほしもち"><img src="assets/star-sprite.webp" alt=""></button><button data-avatar="1" aria-label="ほしねこ"><img src="assets/moon-cat.webp" alt=""></button><button data-avatar="2" aria-label="もふうさ"><img src="assets/cloud-bunny.webp" alt=""></button><button data-avatar="3" aria-label="くもまる"><img src="assets/blue-cloud.webp" alt=""></button><button id="addBot" aria-label="BOTを追加">＋</button></div><div class="difficulty" aria-label="BOTの難易度"><button data-difficulty="easy">やさしい</button><button data-difficulty="normal">普通</button><button data-difficulty="hard">強い</button></div><div class="bot-footer"><button id="removeBot">選択BOTを外す</button></div></section><button id="beginGame" data-intent="startGame" class="pill lavender">ゲームを開始する <span>›</span></button><footer class="screen-return-bar"><button id="lobbyBack" class="screen-return" aria-label="ホームへ戻る">ホームへ戻る</button></footer></section>
<section id="battleScreen" class="screen hide" aria-label="対戦"><header class="topbar"><button id="homeBtn" class="circle battle-exit" aria-label="対戦を終了してホームへ" aria-controls="restartConfirm" aria-expanded="false">終了</button><h1 id="battleTitle"><span id="battlePhase" class="hide"></span><span class="battle-meta"><span id="roundLabel"></span><span id="survivorCount"></span></span></h1><button id="battleSoundToggle" class="circle sound-toggle" data-sound-toggle aria-label="音をオフにする" aria-pressed="false">♪</button><button id="rulesBtn" class="circle" aria-label="遊び方">?</button></header><p id="onlineBattleStatus" class="room-status hide" role="status" aria-live="polite"></p><section id="restartConfirm" class="glass hide" aria-labelledby="restartTitle"><h2 id="restartTitle"></h2><p id="restartText"></p><div class="button-row"><button id="cancelRestart">続ける</button><button id="confirmRestart" class="gold">終了して戻る</button></div></section><div id="playerGrid" class="battle-grid" tabindex="0" aria-label="プレイヤーとカード（上下にスクロール）"></div><section id="gamePanel"><div class="bid-panel glass"><div id="bidActor" aria-hidden="true"></div><span>現在の宣言</span><strong id="bid">—</strong><span id="lastBidder"></span></div><div id="emoteBar" class="emote-bar" role="group" aria-label="リアクションと捨て札"></div><div id="bidHistory" class="bid-history" aria-label="直近の宣言"></div><div id="status" class="sr-only" role="status" aria-live="polite" tabindex="-1"></div><div class="input-console glass"><div class="controls"><div id="keypad" class="keypad" role="group" aria-label="数字入力"><button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button><button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button><button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button><button class="zero" data-digit="0">0</button><button id="backspace" aria-label="最後の1文字を消す">⌫</button><div id="deckIndicator" class="deck-indicator" role="status"><div class="player-card hidden deck-stack" aria-hidden="true">?</div><span id="deckCount"></span></div></div><div class="decisions"><button id="declare" class="declare-region gold" aria-describedby="inputHint inputError"><span id="number" aria-label="宣言する数字"></span><span class="declare-label">宣言</span></button><button id="challenge" class="lavender">グラビティ！<img src="assets/star-sprite.webp" alt="" aria-hidden="true"></button></div></div><p id="inputHint" class="sr-only">前より大きな1以上の整数を宣言</p><p id="inputError" role="alert" class="error"></p></div></section><div id="resultAnnouncement" class="sr-only" role="status" aria-live="polite"></div><section id="result" class="hide"><h2 id="resultTitle" class="sr-only" tabindex="-1">ラウンド結果</h2><section class="calculation glass" aria-live="off"><div><h3 id="calculationHeading">計算の流れ</h3><div id="calculationSteps"></div></div><div class="final-total"><span id="totalLabel">最終合計</span><strong id="finalTotal"></strong></div></section><div class="result-message glass"><div id="resultAvatar" aria-hidden="true"></div><div><p id="resultText"></p><p id="streakSummary"></p></div></div><button id="next" class="pill gold">次のラウンドへ <span>›</span></button><button id="returnRoomLobby" class="pill blue hide" type="button">ルームロビーに戻る</button></section></section>
<section id="guidePanel" class="screen hide" aria-label="ゲームガイド"><header class="topbar"><h1 id="guideTitle" class="sr-only">遊び方</h1></header><div class="guide-tabs" role="tablist" aria-label="ガイド"><button data-tab="rules" role="tab">遊び方</button><button data-tab="cards" role="tab">カード図鑑</button><button data-tab="bots" role="tab">BOT</button><button data-tab="examples" role="tab">計算例</button></div><article id="guideContent" tabindex="-1"></article><footer class="screen-return-bar"><button id="closeGuide" class="screen-return" aria-label="ガイドを閉じる">閉じる</button></footer></section>
<section id="joinPanel" class="screen hide" aria-labelledby="joinTitle"><header class="topbar"><h1 id="joinTitle">ルームに参加</h1></header><form id="joinForm" class="join-form glass"><label class="sr-only" for="roomId">ルームID</label><input id="roomId" name="roomId" placeholder="ルームID" autocomplete="off" maxlength="64" required><button id="joinRoom" data-intent="joinRoom" class="pill blue" type="submit">参加する</button><p id="roomJoinStatus" class="room-status" role="status" aria-live="polite"></p></form><section id="joinPublicPanel" class="public-room-panel glass" aria-labelledby="publicRoomsTitle"><div class="public-room-heading"><h2 id="publicRoomsTitle">公開ルーム一覧</h2><button id="refreshPublicRooms" type="button">更新</button></div><p id="publicRoomsStatus" class="room-status" role="status" aria-live="polite">公開ルーム一覧は準備中です。ルームIDで参加できます。</p><div id="publicRoomsList" class="public-room-list"></div></section><footer class="screen-return-bar"><button id="closeJoin" class="screen-return" aria-label="ホームへ戻る">ホームへ戻る</button></footer></section>
<dialog id="cardDetail"><button id="closeCardDetail" class="circle" aria-label="カード詳細を閉じる">×</button><div id="cardDetailContent"></div></dialog><dialog id="discardDetail" aria-labelledby="discardTitle"><button id="closeDiscard" type="button" aria-label="捨て札を閉じる">閉じる</button><h2 id="discardTitle">捨て札</h2><p>現在の山札に戻っていない公開済みカード</p><div id="discardList"></div></dialog></main><script src="engine.js"></script><script src="scheduler.js"></script><script src="background-motion.js"></script><script src="card-presentation.js"></script><script src="game-audio.js"></script><script src="card-art.js"></script><script src="component-card-reveal.js"></script><script src="component-scene-motion.js"></script><script src="special-svg-motion.js"></script><script src="special-effects-controller.js"></script><script src="guide-diagrams.js"></script><script src="gameplay-feedback.js"></script><script src="round-advance-clock.js"></script><script src="local-turn-clock.js"></script><script src="app.js"></script><script src="gravity-room-adapter.js"></script><script src="gravity-platform.js"></script></body></html>
