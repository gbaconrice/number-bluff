<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ナンバーブラフ</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:#101425;color:#f4f4ff}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 15% 22%,#29385b66,transparent 40%),radial-gradient(circle at 86% 65%,#45355c44,transparent 38%),#101425}
main{max-width:650px;margin:auto;padding:clamp(14px,3vw,28px);padding-top:max(env(safe-area-inset-top),18px);padding-bottom:max(env(safe-area-inset-bottom),20px)}
h1{font-size:clamp(27px,6vw,42px);text-align:center;margin:16px 0 6px;letter-spacing:.07em}p{line-height:1.6}.sub{text-align:center;color:#aab4d4;margin:0 0 24px}
.panel{background:#202a45;border:1px solid #526184;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 8px 22px #05071144}
.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.player{text-align:center;min-width:0}
.label{font-size:14px;color:#c2cbea;font-weight:700}.hearts{color:#ff858d;margin:6px 0}.card{display:grid;place-items:center;margin:12px auto;background:#f9f9ff;color:#121629;border:3px solid #b7c4da;border-radius:14px;width:96px;height:132px;font-size:56px;font-weight:900}
.card.hidden{background:repeating-linear-gradient(45deg,#344362 0 13px,#242e48 13px 26px);color:#c9d5ff}
.big{text-align:center;font-weight:800;font-size:clamp(28px,9vw,56px);color:#ffdb91;margin:5px}
.status{text-align:center;color:#d9dded;font-weight:700;min-height:28px}.controls{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}
button,input{font:inherit;border-radius:14px;min-height:52px}button{background:#668cf4;color:#fff;border:none;font-weight:800;padding:12px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
button.danger{background:#ed7387;grid-column:1/-1}button.secondary{background:#384768}button.green{background:#50ad91}input{background:#121a2f;color:#fff;border:2px solid #6a83b6;padding:12px;width:100%;font-size:22px;text-align:center}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.actions button{font-size:14px;min-height:42px;padding:8px 14px}
#result{display:none}#result.open{display:block}.resultCards{display:flex;justify-content:center;gap:12px}.smallcard{background:#f7f8ff;color:#141a32;border-radius:10px;padding:14px 18px;font-size:28px;font-weight:900}
.note{font-size:13px;color:#a6b4d3;text-align:center}.hide{display:none!important}
</style></head><body><main>
<h1>ナンバーブラフ</h1><p class="sub">見えない数字を推理しよう</p>
<div class="actions"><button class="secondary" id="rulesBtn">遊び方</button><button class="secondary" id="restartBtn">新しく対戦</button></div>
<section class="panel players">
<div class="player"><div class="label">BOT</div><div class="hearts" id="botLife"></div><div class="card" id="botCard">?</div></div>
<div class="player"><div class="label">あなた</div><div class="hearts" id="humanLife"></div><div class="card hidden" id="humanCard">?</div></div>
</section>
<section class="panel" id="gamePanel"><div class="status" id="status" aria-live="polite"></div><p class="note">現在の宣言</p><div class="big" id="bid">—</div>
<div class="controls"><input type="text" id="number" inputmode="numeric" pattern="[0-9]*" aria-label="宣言する数値" placeholder="数字">
<button id="declare">宣言</button><button class="danger" id="challenge">グラビティ！</button></div></section>
<section class="panel" id="result"><h2 id="resultTitle"></h2><div class="resultCards" id="resultCards"></div><p id="resultText"></p><button class="green" id="next">次のラウンドへ</button></section>
<section class="panel hide" id="rules"><h2>遊び方</h2><p>自分のカードだけ見えません。相手のカードと山札の構成から2人の合計を予測し、0以上の整数を宣言します。次の人は前より大きな数を宣言するか、「グラビティ！」で前の宣言を疑います。</p><p>直前の宣言が合計を超えていれば宣言者の負け、合計以下なら疑った側の負け。負けるとライフが1減り、0でゲーム終了です。</p><p>カードは0・1・2・3・5・10が各4枚の全24枚。この初期版はローカルの1人対BOT対戦です。</p><button class="secondary" id="closeRules">閉じる</button></section>
<p class="note">Web版 開発初期プレビュー（外部マルチプレイは未実装）</p>
</main><script>
(()=>{'use strict';
const values=[0,1,2,3,5,10],full=values.flatMap(n=>Array(4).fill(n));
const $=id=>document.getElementById(id),s={deck:[],discard:[],hands:[],life:[3,3],bid:null,last:-1,turn:0,phase:'play',round:0};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function refill(){if(s.deck.length<2){s.deck.push(...shuffle(s.discard.splice(0)))}}
function draw(){if(!s.deck.length){s.deck.push(...shuffle(s.discard.splice(0)))}return s.deck.pop()}
function newRound(){refill();s.hands=[draw(),draw()];s.bid=null;s.last=-1;s.turn=s.round%2;s.round++;s.phase='play';$('result').classList.remove('open');$('gamePanel').classList.remove('hide');render();if(s.turn===1)botMove()}
function reset(){s.deck=shuffle(full.slice());s.discard=[];s.life=[3,3];s.round=0;newRound()}
function render(){ $('botCard').textContent=s.hands[1];$('humanCard').textContent=s.phase==='play'?'?':s.hands[0];$('humanCard').classList.toggle('hidden',s.phase==='play');
$('humanLife').textContent='♥'.repeat(s.life[0])+'♡'.repeat(3-s.life[0]);$('botLife').textContent='♥'.repeat(s.life[1])+'♡'.repeat(3-s.life[1]);$('bid').textContent=s.bid??'—';
$('status').textContent=s.phase!=='play'?'判定中':s.turn===0?'あなたの番です':"BOTが考えています…";
$('declare').disabled=s.phase!=='play'||s.turn!==0;$('challenge').disabled=s.phase!=='play'||s.turn!==0||s.bid===null;
if(s.phase==='play'&&s.turn===0)$('number').value=s.bid===null?'0':String(s.bid+1)}
function declare(who,n){if(s.phase!=='play'||s.turn!==who||!Number.isSafeInteger(n)||n<0||(s.bid!==null&&n<=s.bid))return false;
s.bid=n;s.last=who;s.turn=1-who;render();if(s.turn===1)botMove();return true}
function challenge(who){if(s.phase!=='play'||s.turn!==who||s.bid===null)return;
s.phase='reveal';const sum=s.hands[0]+s.hands[1],loser=s.bid>sum?s.last:who;s.life[loser]--;
$('resultTitle').textContent=loser===0?'あなたの負け':'BOTの負け';
$('resultCards').innerHTML='';for(const [i,v] of s.hands.entries()){const c=document.createElement('div');c.className='smallcard';c.textContent=(i===0?'あなた ':'BOT ')+v;$('resultCards').append(c)}
$('resultText').textContent='合計 '+sum+' / 宣言 '+s.bid+'。'+(s.life[loser]===0?(loser===0?'BOTの優勝！':'あなたの優勝！'):'ライフが1減りました。');
s.discard.push(...s.hands);s.hands=[];$('next').textContent=s.life[loser]===0?'再戦する':'次のラウンドへ';$('result').classList.add('open');$('gamePanel').classList.add('hide');
$('humanCard').textContent=loser===0?'公開済み':'公開済み';render()}
function botMove(){setTimeout(()=>{if(s.phase!=='play'||s.turn!==1)return;
const unknown=s.deck.concat(s.discard).concat([s.hands[1]]);const expected=unknown.reduce((a,b)=>a+b,0)/Math.max(1,unknown.length)+s.hands[0];
const jitter=(Math.random()-.5)*4,guess=expected+jitter;const threshold=s.bid===null?1:s.bid;
if(s.bid!==null&&threshold>guess+(Math.random()*3-1))challenge(1);
else declare(1,Math.max(s.bid===null?0:s.bid+1,Math.floor(guess)-(Math.random()<.25?2:0)));},550+Math.random()*550)}
$('declare').onclick=()=>{let raw=$('number').value.replace(/[０-９]/g,c=>String(c.charCodeAt(0)-65296)).trim();if(!/^\d{1,8}$/.test(raw)||!declare(0,Number(raw)))alert('直前の宣言より大きい0以上の整数を入力してください。')};
$('challenge').onclick=()=>challenge(0);$('next').onclick=()=>{if(s.life.some(n=>n===0))reset();else newRound()};
$('restartBtn').onclick=()=>{if(confirm('現在の対戦を終了して再戦しますか？'))reset()};
$('rulesBtn').onclick=()=>$('rules').classList.remove('hide');$('closeRules').onclick=()=>$('rules').classList.add('hide');
reset();
})();
</script></body></html>
