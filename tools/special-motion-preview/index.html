<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>特殊4枚 原画面の局所動作</title><link rel="stylesheet" href="component-special-motion.css"><style>body{margin:20px;background:#0b1025;color:#eee;font:16px system-ui}main{display:flex;gap:24px;flex-wrap:wrap}.card{position:relative;width:210px;aspect-ratio:1051/1496;background-position:center;background-size:100% 100%;border-radius:20px;overflow:hidden}.value{position:absolute;top:16%;width:100%;text-align:center;font-size:52px;font-weight:800;z-index:4;color:#fff1c6}button,select{padding:10px;margin:6px}body.small .card{width:80px;border-radius:8px}body.small .value{font-size:19px}p{max-width:620px}</style><h1>特殊の原画を維持した局所効果</h1><select id="kind"><option value="extra">? 球内部</option><option value="double">×2 星雲</option><option value="max0">MAX 王冠面</option><option value="reset">リセット 矢印面</option></select><main><section>元絵<div id="original" class="card"><span class="value">?</span></div></section><section>局所効果<div id="target" class="card"><span class="value">?</span></div></section></main><p><button id="play">発動</button><button data-p="0">0%</button><button data-p=".5">50%</button><button data-p="1">100%</button><button id="size">80px 切替</button></p><p id="state">読み込み中</p><script src="component-special-motion.js"></script><script>const sources=Object.fromEntries(['extra','double','max0','reset'].map(k=>[k,'../../assets/card-'+k+'.webp']));const effect=NumberBluffSpecialMotion.create({sources});window.specialPrototype=effect;window.changeKind=k=>{effect.stop();kind.value=k;for(const el of[original,target]){el.style.aspectRatio={extra:'1049/1500',double:'1051/1496',max0:'1049/1499',reset:'1062/1482'}[k];el.style.backgroundImage=`url(${sources[k]})`;el.querySelector('.value').textContent={extra:'?',double:'×2',max0:'MAX→0',reset:'リセット'}[k]}};changeKind('extra');effect.ready.then(ok=>state.textContent=ok?'未採用比較試作。元絵は変更なし。':'WebGL不可：元絵を維持');kind.onchange=()=>changeKind(kind.value);play.onclick=()=>effect.play(target,kind.value);document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>effect.renderAt(target,kind.value,+b.dataset.p));size.onclick=()=>{effect.stop();document.body.classList.toggle('small')};</script></html>
