<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通常の空texture検品</title><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../card-presentation.css"><link rel="stylesheet" href="../../card-art.css"><link rel="stylesheet" href="card-surface-motion.css"><style>body{margin:20px;background:#0b1025;color:#eee;min-height:0;overflow:auto}h1{font-size:22px;margin:12px 0}.prototype-shell{display:flex;gap:24px;flex-wrap:wrap}.prototype-shell .player-card{width:210px}.small .prototype-shell .player-card{width:80px}button,select{padding:10px;margin:6px;font-size:14px}p{max-width:620px}</style></head><body><h1>通常1・4・20の空だけ流動</h1><select id="kind"><option value="normal1">1</option><option value="normal4">4</option><option value="normal20">20</option><option value="extra">? 共有renderer確認</option></select><div class="prototype-shell"><section>元絵<div id="original"></div></section><section>局所効果<div id="target"></div></section></div><p><button id="play">発動</button><button data-p="0">0%</button><button data-p=".25">25%</button><button data-p=".5">50%</button><button data-p=".75">75%</button><button data-p="1">100%</button></p><p id="state">未採用比較試作・元画像と本番カードCSSを使用</p><script src="../../engine.js"></script><script src="../../card-art.js"></script><script src="card-surface-motion.js"></script><script>
const sources={normal1:'../../assets/card-normal-1.webp',normal4:'../../assets/card-normal-4.webp',normal20:'../../assets/card-normal-20.webp',extra:'../../assets/card-extra.webp',double:'../../assets/card-double.webp',max0:'../../assets/card-max0.webp',reset:'../../assets/card-reset.webp'};
const effect=NumberBluffCardSurfaceMotion.create({sources});window.normalSurface=effect;
window.changeKind=k=>{effect.stop();document.getElementById('kind').value=k;const normal=k.startsWith('normal'),value=Number(k.slice(6));const card=NumberBluff.FULL_DECK.find(c=>normal?c.kind==='number'&&c.value===value:c.kind===k);for(const el of[document.getElementById('original'),document.getElementById('target')]){el.className=normal?'player-card normal-card kind-number':'player-card special kind-'+k;if(normal)el.dataset.artValue=String(value);else delete el.dataset.artValue;const label=document.createElement('span');label.className='card-value';label.textContent=k==='reset'?'リセット':card.label;const img=NumberBluffCardArt.create(document,card);img.src=sources[k];el.replaceChildren(label,img);}};
changeKind('normal4');document.getElementById('kind').onchange=e=>changeKind(e.target.value);document.getElementById('play').onclick=()=>effect.play(target,document.getElementById('kind').value);document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>effect.renderAt(target,document.getElementById('kind').value,+b.dataset.p));
</script></body></html>
