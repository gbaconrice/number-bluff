<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通常カード 元背景の星光</title><link rel="stylesheet" href="normal-sky-motion.css"><style>body{background:#18203a;color:white;margin:20px;font:16px system-ui}main{display:flex;gap:20px}.card{position:relative;width:210px;aspect-ratio:2/3;background-size:100% 100%;overflow:hidden;border-radius:16px}.value{position:absolute;z-index:4;top:12%;width:100%;text-align:center;color:#1d2557;font-size:54px;font-weight:800}.small .card{width:80px}.small .value{font-size:24px}button,select{padding:10px;margin:6px}</style><h1>キャラ固定・背景の元の星光のみ</h1><select id="kind"></select><main><section>元絵<div class="card" id="original"><span class="value"></span></div></section><section>背景明暗<div class="card" id="target"><span class="value"></span></div></section></main><button id="play">8秒再生</button><button data-t="0">0秒</button><button data-t="2">2秒</button><button data-t="4">4秒</button><button data-t="8">8秒</button><button id="size">80px切替</button><pre id="status"></pre><script src="normal-sky-motion.js"></script><script>const sources={"-10": "../../assets/card-normal-minus10.webp", "-5": "../../assets/card-normal-minus5.webp", "0": "../../assets/card-normal-0.webp", "1": "../../assets/card-normal-1.webp", "2": "../../assets/card-normal-2.webp", "3": "../../assets/card-normal-3.webp", "4": "../../assets/card-normal-4.webp", "5": "../../assets/card-normal-5.webp", "10": "../../assets/card-normal-10.webp", "15": "../../assets/card-normal-15.webp", "20": "../../assets/card-normal-20.webp"};const ratios={"-10": "1061/1482", "-5": "1061/1482", "0": "1061/1483", "1": "1061/1482", "2": "1061/1483", "3": "1061/1482", "4": "1061/1482", "5": "1061/1482", "10": "1024/1536", "15": "1024/1536", "20": "1024/1536"};const fx=NumberBluffNormalSky.create({sources});window.normalPrototype=fx;for(const k of Object.keys(NumberBluffNormalSky.specs)){const o=new Option(k,k);kind.add(o)}window.changeKind=k=>{fx.stop();kind.value=k;const spec=NumberBluffNormalSky.specs[k];for(const e of [original,target]){e.style.aspectRatio=ratios[k];e.style.backgroundImage=`url(${sources[k]})`;e.querySelector('.value').textContent=k}};changeKind('4');kind.onchange=()=>changeKind(kind.value);play.onclick=()=>fx.play(target,kind.value);document.querySelectorAll('[data-t]').forEach(b=>b.onclick=async()=>{await fx.renderAt(target,kind.value,+b.dataset.t);status.textContent=JSON.stringify(fx.diagnose(),null,2)});size.onclick=()=>{fx.stop();document.body.classList.toggle('small')};</script></html>
