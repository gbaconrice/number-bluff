name: Art glow prototype preview (not a release check)
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: prototype-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Focused immutable-art and lifecycle checks
        run: node --test test/special-art-glow-prototype.test.js test/special-svg-lifecycle.test.js test/card-motion-pixel-metrics.test.js
      - run: npm install --no-save --package-lock=false --ignore-scripts --registry=https://registry.npmjs.org playwright@1.57.0
      - run: npx --no-install playwright install --with-deps chromium
      - run: node tools/build-single-html.mjs
      - name: Real-time source-art lighting frames
        run: node tools/card-motion-periodic.mjs
      - name: Prototype evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art-glow-prototype-frames
          path: |
            artifacts/*effect-*.png
            artifacts/*ambient*.png
            artifacts/periodic-card-motion.json
          if-no-files-found: ignore
          retention-days: 7
