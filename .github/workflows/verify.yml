name: Verify preview
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Engine and scheduler tests
        run: npm test
      - name: Install browser test dependency (no runtime dependencies)
        run: npm install --no-save --package-lock=false --ignore-scripts --registry=https://registry.npmjs.org playwright@1.57.0
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Build single HTML handoff
        run: node tools/build-single-html.mjs
      - name: Automatic card motion on mobile and desktop
        run: node tools/card-motion-periodic.mjs
      - name: Natural-time special-card frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natural-card-motion-preview
          path: |
            artifacts/*effect-*.png
            artifacts/periodic-card-motion.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Early visual preview (full regression remains mandatory)
        id: visual
        continue-on-error: true
        run: node tools/e2e.mjs --visual-only
      - name: Early visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: early-visual-preview
          path: artifacts/visual-preview/
          if-no-files-found: ignore
          retention-days: 7
      - name: Isolated official number and victory components
        id: scene
        continue-on-error: true
        run: node --test tools/scene-motion/test/component-scene-motion.test.mjs
      - name: Component scene screenshots before full regression
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-component-preview
          path: artifacts/scene-mobile-components.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Browser regression and responsive checks
        run: node tools/e2e.mjs
      - name: Require early visual checks
        if: always() && (steps.visual.outcome == 'failure' || steps.scene.outcome == 'failure')
        run: exit 1
      - name: Screenshots and test results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-browser-results
          path: |
            artifacts/*.png
            artifacts/*.json
          if-no-files-found: ignore
          retention-days: 7

