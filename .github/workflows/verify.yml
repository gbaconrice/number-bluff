name: Verify preview
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts
      - name: Engine and scheduler tests
        run: npm test
      - name: Install browser test dependency (no runtime dependencies)
        run: npm install --no-save --package-lock=false --ignore-scripts --registry=https://registry.npmjs.org playwright@1.57.0
      - name: Install Chromium
        run: npx --no-install playwright install chromium
      - name: Japanese preview font (host browser libraries are preinstalled)
        run: sudo apt-get install -y --no-install-recommends -o Acquire::http::Timeout=30 -o Acquire::Retries=1 fonts-ipafont-gothic
      - name: Build single HTML handoff
        run: node tools/build-single-html.mjs
      - name: Real synthesized audio and sound toggle
        run: node tools/audio-output.mjs
      - name: Centered hidden card and fine reflective detail
        run: node tools/hidden-card-back-preview.mjs
      - name: Public and private lobby scaffold preview
        run: node tools/lobby-access-preview.mjs
      - name: Online and local turn deadlines and nonblocking countdown
        run: node tools/online-turn-timer.mjs
      - name: Result presentation and automatic next round
        run: node tools/round-advance-preview.mjs
      - name: Early online clock screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: online-clock-preview
          path: |
            artifacts/turn-clock-*.png
            artifacts/local-turn-clock-*.png
            artifacts/round-clock-*.png
            artifacts/round-advance-preview.json
            artifacts/online-turn-timer.json
            artifacts/lobby-access-*.png
            artifacts/lobby-access-preview.json
            artifacts/hidden-card-back/
            artifacts/audio-output-*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Automatic card motion on mobile and desktop
        run: node tools/card-motion-periodic.mjs
      - name: Natural-time special-card frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natural-card-motion-preview
          path: |
            artifacts/*effect-*.png
            artifacts/periodic-card-motion.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Special rendering comparison (desktop CPU-throttled proxy)
        run: node tools/special-render-benchmark.mjs
      - name: Early special performance and visual comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: special-render-comparison
          path: artifacts/special-render-benchmark/
          if-no-files-found: ignore
          retention-days: 7
      - name: Actual source-art motion preview
        run: node tools/art-glow-preview.mjs
      - name: Early visual preview (full regression remains mandatory)
        id: visual
        continue-on-error: true
        run: node tools/e2e.mjs --visual-only
      - name: Early visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: early-visual-preview
          path: artifacts/visual-preview/
          if-no-files-found: ignore
          retention-days: 7
      - name: Isolated official number and victory components
        id: scene
        continue-on-error: true
        run: node --test tools/scene-motion/test/component-scene-motion.test.mjs
      - name: Component scene screenshots before full regression
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-component-preview
          path: artifacts/scene-mobile-components.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Browser regression and responsive checks
        run: node tools/e2e.mjs
      - name: Require early visual checks
        if: always() && (steps.visual.outcome == 'failure' || steps.scene.outcome == 'failure')
        run: exit 1
      - name: Screenshots and test results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-browser-results
          path: |
            artifacts/art-glow-preview/
            artifacts/hidden-card-back/
            artifacts/special-render-benchmark/
            artifacts/*.png
            artifacts/*.json
          if-no-files-found: ignore
          retention-days: 7


  webkit-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Install audio test browser
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --registry=https://registry.npmjs.org playwright@1.57.0
          npx --no-install playwright install --with-deps webkit
      - name: Real WebKit audio unlock and destination waveform
        run: AUDIO_BROWSER=webkit node tools/audio-output.mjs
      - name: WebKit destination waveform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-audio-output
          path: artifacts/audio-output-webkit.json
          if-no-files-found: ignore
          retention-days: 7
